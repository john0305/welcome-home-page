<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>

  <!-- Radar rings -->
  <circle cx="16" cy="16" r="13" stroke="#1e3a8a" stroke-width="0.6" opacity="0.7"/>
  <circle cx="16" cy="16" r="9"  stroke="#1e3a8a" stroke-width="0.6" opacity="0.7"/>
  <circle cx="16" cy="16" r="5"  stroke="#1e3a8a" stroke-width="0.6" opacity="0.7"/>

  <!-- Crosshairs -->
  <line x1="16" y1="3"  x2="16" y2="29" stroke="#1e3a8a" stroke-width="0.4" opacity="0.6"/>
  <line x1="3"  y1="16" x2="29" y2="16" stroke="#1e3a8a" stroke-width="0.4" opacity="0.6"/>

  <!-- Sweep trail (pie slice ~60°) -->
  <path d="M16 16 L25.25 6.75 A13 13 0 0 0 16 3 Z" fill="#8b5cf6" opacity="0.12"/>

  <!-- Sweep line -->
  <line x1="16" y1="16" x2="25.25" y2="6.75" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Blips — "listings tracked" -->
  <circle cx="22.5" cy="8.5"  r="1.6" fill="#a78bfa"/>
  <circle cx="10"   cy="22"   r="1.2" fill="#a78bfa" opacity="0.65"/>
  <circle cx="21"   cy="19.5" r="1.0" fill="#a78bfa" opacity="0.5"/>
  <circle cx="8.5"  cy="12"   r="0.9" fill="#a78bfa" opacity="0.4"/>
  <circle cx="18"   cy="13"   r="0.7" fill="#c4b5fd" opacity="0.6"/>

  <!-- Center origin dot -->
  <circle cx="16" cy="16" r="1.8" fill="#8b5cf6"/>
</svg>
